version: '3.8'

services:
  agent:
    build: .
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - DATABASE_URL=sqlite:///data/trading.db
    command: python main.py run --name AlphaBot --rounds 100

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./config:/app/config

  api:
    build: .
    command: python main.py api --port 8000 --host 0.0.0.0
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
