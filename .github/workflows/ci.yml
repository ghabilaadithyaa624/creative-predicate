name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Deliberately a core-only install. The suite must pass without torch,
      # streamlit, chromadb or playwright -- optional stacks are guarded by
      # try/except ImportError, and this job is what keeps that true.
      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run test suite
        run: pytest tests/ -v --cov=. --cov-report=term-missing

      - name: Verify legacy test runner still works
        run: python tests/run_tests.py

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Exercise the documented entry points end to end so a broken CLI cannot
      # merge green. No network: the scraper falls back to its simulated feed.
      - name: init
        run: creative-predicate init

      - name: Deterministic backtest
        run: creative-predicate backtest

      - name: Monte Carlo backtest
        run: creative-predicate backtest --monte-carlo

      - name: Agent run
        run: creative-predicate run --name CIBot --rounds 3

      - name: Multi-agent tournament
        run: creative-predicate simulate-all --rounds 3

      # The frontend must import cleanly and must not be required by the
      # backend. Guards the one-way backend <- frontend dependency.
      - name: Frontend imports resolve
        run: |
          pip install -e ".[dashboard]"
          python -c "import frontend.dashboard.app; print('frontend ok')"
